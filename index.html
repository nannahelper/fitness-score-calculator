<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>体测分数计算器</title>
  <link rel="stylesheet" href="styles.css?v=data-20260921">
</head>
<body>
  <main>
    <div class="title-row"><div><h1>体测分数计算器</h1><p class="muted">大学生体质健康测试评分表 · 结果仅在本机计算</p></div><div class="version-switch"><span>数据</span><button id="versionSpring" class="version-button active" type="button">春秋版</button><button id="versionLegacy" class="version-button" type="button">旧版</button></div></div>
    <p id="versionNote" class="version-note"></p>

    <nav class="tabs" aria-label="功能"><button class="mode-tab active" data-mode="college">综合成绩</button><button class="mode-tab" data-mode="nju2400">2400 米</button><button class="mode-tab" data-mode="lookup">评分表</button></nav>

    <section class="mode-panel" data-panel="college">
      <div class="row selectors"><label>性别<select id="gender"><option value="male">男生</option><option value="female">女生</option></select></label><label>年级<select id="grade"><option value="freshman">大一 / 大二</option><option value="senior">大三 / 大四</option></select></label><button class="reset" id="resetButton" type="button">重置</button></div>
      <div class="fields" id="measureGrid"></div>
      <div class="result" id="resultArea" aria-live="polite"></div>
    </section>

    <section class="mode-panel hidden" data-panel="nju2400">
      <div class="row"><label>性别<select id="runGender"><option value="male">男生</option><option value="female">女生</option></select></label><label>分钟<input id="runMin" type="number" inputmode="numeric" min="0" max="99" placeholder="10"></label><label>秒<input id="runSec" type="number" inputmode="numeric" min="0" max="59" placeholder="30"></label><small class="time-help">分:秒填写，例如 10 分 30 秒；秒数 00–59</small></div>
      <div class="result" id="runResult"><span class="muted">输入成绩</span></div>
    </section>

    <section class="mode-panel hidden" data-panel="lookup">
      <div class="row"><label>项目<select id="lookupEvent"></select></label><label>性别<select id="lookupGender"><option value="male">男生</option><option value="female">女生</option></select></label><label>年级<select id="lookupGrade"><option value="freshman">大一 / 大二</option><option value="senior">大三 / 大四</option></select></label></div>
      <div class="table-wrap"><table id="lookupTable"></table></div>
    </section>
  </main>
  <script src="app.js?v=data-20260921" type="module"></script>
</body>
</html>
